<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布动态 · 拾光</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- ============ 顶部导航栏 ============ -->
  <nav class="navbar">
    <a class="logo" href="index.html">拾光</a>
    <div class="nav-right">
      <a class="btn btn-ghost" href="index.html">← 回首页</a>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">发布动态</h1>
    <div class="card">
      <div class="field">
        <textarea id="postContent" maxlength="500"
                  placeholder="分享此刻的想法、心情、日常……"></textarea>
        <div style="text-align:right" class="muted">
          <span id="charCount">0</span> / 500
        </div>
      </div>
      <!-- 图片上传（二期）：选图/拖图 → 浏览器本地压缩 → 上传 Supabase 图片桶 -->
      <div class="field">
        <label>图片（选一张，发布前自动压缩）</label>
        <input type="file" id="photoInput" accept="image/*" style="display:none">
        <!-- 拖放区：点这里选图，或把图片文件直接拖进来 -->
        <div class="img-drop" id="dropZone">
          <p>点这里选择图片，或把图片文件直接拖进来</p>
          <button type="button" class="btn btn-ghost" id="pickPhotoBtn">选择图片</button>
        </div>
        <div class="img-preview-wrap" id="imgPreviewWrap" style="display:none">
          <img class="post-img" id="imgPreview" alt="图片预览">
          <button type="button" class="btn btn-ghost" id="removePhotoBtn">移除图片</button>
        </div>
        <p class="muted" style="margin-top:8px">图片会先压缩到长边 1280 像素再上传，省流量、省免费空间（1GB）</p>
      </div>
      <button class="btn btn-primary" id="publishBtn" style="width:100%">发 布</button>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    App.initFx();

    /* 发布页必须登录才能进：未登录直接跳转登录页 */
    App.requireLogin();

    /* 实时显示已输入字数 */
    document.getElementById("postContent").addEventListener("input", (e) => {
      document.getElementById("charCount").textContent = e.target.value.length;
    });

    /* ---------- 图片选择（点击 / 拖拽两种方式）与预览 ---------- */
    let chosenImage = null;    // 选中的原始图片文件
    let previewUrl = null;     // 预览用的临时地址

    /* 把选中的图片文件应用到预览 */
    function applyImage(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) { App.showToast("只支持图片文件哦"); return; }
      chosenImage = file;
      if (previewUrl) URL.revokeObjectURL(previewUrl);   // 释放上一次的预览地址
      previewUrl = URL.createObjectURL(file);            // 生成本地临时预览地址
      document.getElementById("imgPreview").src = previewUrl;
      document.getElementById("imgPreviewWrap").style.display = "";
    }

    document.getElementById("pickPhotoBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("photoInput").click();
    });
    document.getElementById("photoInput").addEventListener("change", (e) => applyImage(e.target.files[0]));

    /* 拖拽上传：dragover 必须 preventDefault，浏览器才允许触发 drop */
    const dropZone = document.getElementById("dropZone");
    dropZone.addEventListener("click", () => document.getElementById("photoInput").click());
    ["dragenter", "dragover"].forEach((ev) =>
      dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.add("dragging"); })
    );
    ["dragleave", "drop"].forEach((ev) =>
      dropZone.addEventListener(ev, (e) => { e.preventDefault(); dropZone.classList.remove("dragging"); })
    );
    dropZone.addEventListener("drop", (e) => applyImage(e.dataTransfer.files && e.dataTransfer.files[0]));

    document.getElementById("removePhotoBtn").onclick = () => {
      chosenImage = null;
      document.getElementById("photoInput").value = "";
      document.getElementById("imgPreviewWrap").style.display = "none";
    };

    /* ---------- 发布：有图先传图，再插帖子 ---------- */
    document.getElementById("publishBtn").onclick = async () => {
      const btn = document.getElementById("publishBtn");
      try {
        const content = document.getElementById("postContent").value.trim();
        if (!content) { App.showToast("内容不能为空哦"); return; }

        btn.disabled = true; btn.textContent = "发布中…";
        const me = await App.getUser();

        // 第 1 步：有图 → 压缩 → 上传到 images 桶（每个用户一个文件夹）
        let imageUrl = null;
        if (chosenImage) {
          const blob = await App.compressImage(chosenImage, 1280, 0.85);
          const path = me.id + "/" + Date.now() + ".jpg";
          const { error: upErr } = await App.db.storage
            .from("images")
            .upload(path, blob, { contentType: "image/jpeg" });
          if (upErr) throw upErr;
          // 拿到这张图片的公开网址，一会儿存进 posts 表
          imageUrl = App.db.storage.from("images").getPublicUrl(path).data.publicUrl;
        }

        // 第 2 步：把帖子（含图片地址）插入 posts 表
        const { error } = await App.db
          .from("posts")
          .insert({ user_id: me.id, content, image_url: imageUrl });

        if (error) throw error;
        App.showToast("发布成功！");
        setTimeout(() => (location.href = "index.html"), 600);
      } catch (err) {
        console.error(err);
        btn.disabled = false; btn.textContent = "发 布";
        App.showToast("发布失败：" + (err.message || err));
      }
    };
  </script>
</body>
</html>
