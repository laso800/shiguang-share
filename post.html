<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布动态 · 拾光</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- ============ 顶部导航栏 ============ -->
  <nav class="navbar">
    <a class="logo" href="index.html">拾光</a>
    <div class="nav-right">
      <a class="btn btn-ghost" href="index.html">← 回首页</a>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">发布动态</h1>
    <div class="card">
      <div class="field">
        <textarea id="postContent" maxlength="500"
                  placeholder="分享此刻的想法、心情、日常……"></textarea>
        <div style="text-align:right" class="muted">
          <span id="charCount">0</span> / 500
        </div>
      </div>
      <!-- 二期：这里会加上传图片按钮 -->
      <p class="muted" style="margin-bottom:14px">图片上传将在二期开放，先发文字动态吧</p>
      <button class="btn btn-primary" id="publishBtn" style="width:100%">发 布</button>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    App.initFx();

    /* 发布页必须登录才能进：未登录直接跳转登录页 */
    App.requireLogin();

    /* 实时显示已输入字数 */
    document.getElementById("postContent").addEventListener("input", (e) => {
      document.getElementById("charCount").textContent = e.target.value.length;
    });

    /* 点击发布：向 posts 表插入一行数据 */
    document.getElementById("publishBtn").onclick = async () => {
      const content = document.getElementById("postContent").value.trim();
      if (!content) { App.showToast("内容不能为空哦"); return; }

      const me = await App.getUser();
      // F12 网络面板里能看到这条 insert 请求 —— 录视频时可以展示
      const { error } = await App.supabase
        .from("posts")
        .insert({ user_id: me.id, content });

      if (error) { App.showToast("发布失败：" + error.message); return; }
      App.showToast("发布成功！");
      setTimeout(() => (location.href = "index.html"), 600);
    };
  </script>
</body>
</html>
