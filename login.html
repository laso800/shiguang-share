<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 · 拾光</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- 顺序很重要：先 Supabase 官方库，再我们的公共脚本 -->
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- 登录 / 注册共用一张卡片，靠切换标签区分 -->
  <div class="form-card card">
    <h1 class="page-title">拾光</h1>
    <p class="muted" style="text-align:center;margin-bottom:20px">记录日常，分享温暖</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" onclick="switchTab('login')">登录</button>
      <button class="tab" id="tabReg" onclick="switchTab('reg')">注册</button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="return false">
      <div class="field">
        <label>用户名 / 邮箱</label>
        <input type="text" id="loginId" placeholder="用户名 或 邮箱" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPwd" placeholder="至少 6 位" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">登 录</button>
    </form>

    <!-- 注册表单（默认隐藏） -->
    <form id="regForm" style="display:none" onsubmit="return false">
      <div class="field">
        <label>用户名（注册后即是你的昵称）</label>
        <input type="text" id="regUsername" placeholder="4-20位字母、数字或下划线" minlength="4" maxlength="20" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="regPwd" placeholder="至少 6 位" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">注 册</button>
      <p class="muted" style="margin-top:10px;text-align:center">无需真实邮箱；请牢记密码（虚拟账号无法找回密码）</p>
    </form>

    <p class="form-hint"><a href="index.html">← 先随便逛逛（不登录也能看帖子）</a></p>
  </div>

  <!-- 提示条 -->
  <div id="toast"></div>

  <script>
    /* 提示函数：App 加载失败时退化为浏览器弹窗，保证一定看得到 */
    function tip(msg) {
      if (window.App) { App.showToast(msg); } else { alert(msg); }
    }

    /* 切换"登录 / 注册"标签 */
    function switchTab(which) {
      const isLogin = which === "login";
      document.getElementById("loginForm").style.display = isLogin ? "" : "none";
      document.getElementById("regForm").style.display = isLogin ? "none" : "";
      document.getElementById("tabLogin").classList.toggle("active", isLogin);
      document.getElementById("tabReg").classList.toggle("active", !isLogin);
    }

    /* 用户名转虚拟邮箱：注册/登录都统一转成 email 再交给 Supabase。
   例：用户输 "xiaoming" → 实际账号是 xiaoming@shiguang.user
   登录时如果输入的是真邮箱（含 @）则原样使用，兼容老账号 */
    const FAKE_DOMAIN = "@shiguang.user";
    function toEmail(input) {
      const v = input.trim();
      return v.includes("@") ? v : v.toLowerCase() + FAKE_DOMAIN;
    }

    /* 登录：用邮箱 + 密码换取登录会话
       try/catch 兜底：无论什么错（网络不通/被拦截/密钥错误）都会弹出原因 */
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();   // 阻止表单默认刷新页面
      try {
        const { error } = await App.db.auth.signInWithPassword({
          email: toEmail(document.getElementById("loginId").value),
          password: document.getElementById("loginPwd").value,
        });
        if (error) throw error;
        tip("欢迎回来！");
        App.prefetchPosts();   // 后台预取首页数据进缓存，待会儿首页秒开
        setTimeout(() => (location.href = "index.html"), 600);
      } catch (err) {
        console.error(err);   // F12 控制台能看到原始错误对象
        tip("登录失败：" + (err.message || err));
      }
    });

    /* 注册：用户名 + 密码即完成注册，昵称直接取用户名 */
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        const username = document.getElementById("regUsername").value.trim();
        // 校验：4-20 位字母、数字或下划线
        if (!/^[A-Za-z0-9_]{4,20}$/.test(username)) {
          tip("用户名需为 4-20 位字母、数字或下划线");
          return;
        }
        const { data, error } = await App.db.auth.signUp({
          email: username.toLowerCase() + FAKE_DOMAIN,   // 虚拟邮箱
          password: document.getElementById("regPwd").value,
        });
        if (error) throw error;
        // 如果管理员在 Supabase 里关掉了"邮箱确认"，data.session 会直接存在
        if (data.session) {
          // 数据库触发器默认给昵称"用户_xxxxxx"，这里立刻覆盖成注册的用户名
          try {
            await App.db.from("profiles").update({ username }).eq("id", data.user.id);
          } catch (updErr) { console.error(updErr); }
          tip("注册成功，欢迎加入拾光！");
          App.prefetchPosts();   // 后台预取首页数据进缓存
          setTimeout(() => (location.href = "index.html"), 600);
        } else {
          tip("注册成功！请先去邮箱点击确认链接");
        }
      } catch (err) {
        console.error(err);
        tip("注册失败：" + (err.message || err));
      }
    });

    /* 最后才启动背景特效：特效失败也不能影响登录/注册按钮 */
    try { App.initFx(); } catch (err) { console.error(err); }
  </script>
</body>
</html>
