<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 · 拾光</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- ============ 顶部导航栏 ============ -->
  <nav class="navbar">
    <a class="logo" href="index.html">拾光</a>
    <div class="nav-right">
      <a class="btn btn-ghost" href="index.html">← 回首页</a>
    </div>
  </nav>

  <main class="container">
    <!-- 个人资料卡（含编辑入口） -->
    <div id="profileCard"></div>

    <!-- 自己的主页才有"收藏"标签（收藏内容对别人保密） -->
    <div class="tabs" id="profileTabs" style="display:none">
      <button class="tab active" id="tabPosts">动态</button>
      <button class="tab" id="tabFavs">收 藏</button>
    </div>

    <!-- 编辑资料的折叠表单（只有本人才显示） -->
    <div class="card" id="editForm" style="display:none">
      <div class="post-title" style="margin-bottom:14px">编辑资料</div>
      <div class="field">
        <label>昵称</label>
        <input type="text" id="editUsername" maxlength="20">
      </div>
      <div class="field">
        <label>个人简介</label>
        <textarea id="editBio" maxlength="100" style="min-height:70px"></textarea>
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">保存</button>
    </div>

    <!-- TA 的动态列表 -->
    <div id="postList"></div>
    <div class="empty" id="emptyTip" style="display:none">
      TA 还没有发布动态<br><br>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    App.initFx();

    /* 网址里 ?user=xxx 表示看别人的主页；没有则是看自己的 */
    let profileId = new URLSearchParams(location.search).get("user");
    let isMe = false;

    async function init() {
      const me = await App.getUser();
      if (!profileId) {
        if (!me) { location.href = "login.html"; return; }
        profileId = me.id;   // 没指定就默认看自己
      }
      isMe = me && me.id === profileId;

      /* ---------- 1. 加载这个人 profile 表中的资料 ----------
         profiles 表在注册时由触发器自动创建一行，所以一定有数据 */
      const { data: profile, error } = await App.db
        .from("profiles")
        .select("id, username, bio, created_at")
        .eq("id", profileId)
        .single();

      if (error || !profile) {
        document.getElementById("profileCard").innerHTML =
          '<div class="card empty">用户不存在</div>';
        return;
      }

      /* ---------- 2. 统计他的帖子数 ---------- */
      const { count: postCount } = await App.db
        .from("posts")
        .select("*", { count: "exact", head: true })
        .eq("user_id", profileId);

      document.getElementById("profileCard").innerHTML = `
        <div class="card" style="text-align:center">
          ${App.avatarHtml(profile.username, true)}
          <div class="post-title" style="margin-top:10px">${App.esc(profile.username)}</div>
          ${profile.bio ? `<p class="muted">${App.esc(profile.bio)}</p>` : '<p class="muted">这个人很懒，还没有写简介</p>'}
          <p class="muted" style="margin-top:8px">
            动态 ${postCount ?? 0} · 加入于 ${profile.created_at ? profile.created_at.slice(0, 10) : "-"}
          </p>
          ${isMe ? '<button class="btn btn-ghost" id="editBtn" style="margin-top:10px">编辑资料</button>' : ""}
        </div>`;

      /* ---------- 3. 本人可以编辑昵称和简介 ---------- */
      if (isMe) {
        document.getElementById("editBtn").onclick = () => {
          const form = document.getElementById("editForm");
          form.style.display = form.style.display === "none" ? "" : "none";
          document.getElementById("editUsername").value = profile.username;
          document.getElementById("editBio").value = profile.bio || "";
        };
        document.getElementById("saveProfileBtn").onclick = async () => {
          const { error } = await App.db
            .from("profiles")
            .update({
              username: document.getElementById("editUsername").value.trim() || profile.username,
              bio: document.getElementById("editBio").value.trim(),
            })
            .eq("id", profileId);   // RLS 策略保证只能改自己的行
          if (error) { App.showToast("保存失败：" + error.message); return; }
          App.showToast("保存成功");
          init();   // 重新加载资料
        };
      }

      /* ---------- 4. "动态 / 收藏"两个标签页 ---------- */
      const list = document.getElementById("postList");
      const emptyTip = document.getElementById("emptyTip");

      function showErr(err) {
        console.error(err);
        emptyTip.style.display = "";
        emptyTip.innerHTML = "加载失败：" + err.message + "<br>请检查网络后刷新重试";
      }

      /* 加载动态（默认标签） */
      async function showPosts() {
        const posts = await App.fetchPostList({ userId: profileId });
        list.innerHTML = posts.map(App.renderPostCard).join("");
        emptyTip.style.display = posts.length ? "none" : "";
        emptyTip.innerHTML = "TA 还没有发布动态";
      }

      /* 加载我的收藏：先查 favorites 表拿到收藏的帖子 id，
         再交给公共函数按 id 查（顺便带上作者/点赞数等统计）。
         收藏是私密的，数据库 RLS 策略保证"只能读自己的收藏"。 */
      async function showFavs() {
        const { data: favs } = await App.db
          .from("favorites")
          .select("post_id")
          .eq("user_id", profileId);
        const ids = (favs || []).map((r) => r.post_id);

        if (ids.length === 0) {
          list.innerHTML = "";
          emptyTip.style.display = "";
          emptyTip.innerHTML = "还没有收藏，去首页给喜欢的帖子点收藏吧";
          return;
        }
        const posts = await App.fetchPostList({ ids, limit: 200 });
        list.innerHTML = posts.map(App.renderPostCard).join("");
        emptyTip.style.display = posts.length ? "none" : "";
      }

      /* 切换标签高亮 */
      function switchTab(which) {
        document.getElementById("tabPosts").classList.toggle("active", which === "posts");
        document.getElementById("tabFavs").classList.toggle("active", which === "favs");
      }

      /* 只有本人能看到收藏标签 */
      if (isMe) {
        document.getElementById("profileTabs").style.display = "";
        document.getElementById("tabPosts").onclick = () => {
          switchTab("posts");
          showPosts().catch(showErr);
        };
        document.getElementById("tabFavs").onclick = () => {
          switchTab("favs");
          showFavs().catch(showErr);
        };
      }

      await showPosts();
    }

    init().catch((err) => {
      console.error(err);
      document.getElementById("profileCard").innerHTML =
        '<div class="card empty">加载失败：' + err.message + '<br>请检查网络后刷新重试</div>';
    });
  </script>
</body>
</html>
