<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 · 拾光</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <!-- ============ 顶部导航栏 ============ -->
  <nav class="navbar">
    <a class="logo" href="index.html">拾光</a>
    <div class="nav-right">
      <a class="btn btn-ghost" id="postLink" href="post.html">+ 发布动态</a>
      <a class="btn btn-ghost" id="profileLink" href="profile.html">个人主页</a>
      <a class="btn btn-ghost" id="loginLink" href="login.html">登录 / 注册</a>
      <button class="btn btn-primary" id="logoutBtn" style="display:none">退出登录</button>
    </div>
  </nav>

  <main class="container">
    <h1 class="page-title">今日拾光</h1>

    <!-- ============ 内容筛选栏 ============
         一期只实现"最新"；"热度 / 点赞 / 关键词搜索"属于二期功能，
         先把界面摆出来，点击会提示"二期上线" -->
    <div class="filter-bar">
      <button class="chip active" id="sortNew">最新</button>
      <button class="chip" id="sortHot">热度</button>
      <button class="chip" id="sortLikes">点赞最多</button>
      <input type="text" class="search-input" id="searchBox"
             placeholder="搜索关键词 / #话题（二期上线）" disabled>
    </div>

    <!-- 帖子列表由 JS 填充。二期时这里会变成瀑布流 -->
    <div id="postList"></div>
    <div class="empty" id="emptyTip" style="display:none">
      还没有动态，登录后发布第一条吧<br><br>
      <a class="btn btn-primary" href="post.html">发布动态</a>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    App.initFx();

    /* ---------- 1. 根据登录状态调整导航栏按钮 ---------- */
    async function setupNav() {
      const me = await App.getUser();
      document.getElementById("loginLink").style.display = me ? "none" : "";
      document.getElementById("logoutBtn").style.display = me ? "" : "none";
      if (me) document.getElementById("profileLink").href = "profile.html?user=" + me.id;
    }
    document.getElementById("logoutBtn").onclick = App.logout;

    /* ---------- 2. 加载帖子列表（默认按时间从新到旧） ---------- */
    async function loadPosts() {
      const posts = await App.fetchPostList();   // 公共函数：查帖子 + 统计
      const list = document.getElementById("postList");
      list.innerHTML = posts.map(App.renderPostCard).join("");
      document.getElementById("emptyTip").style.display = posts.length ? "none" : "";
    }

    /* ---------- 3. 筛选按钮（一期只做"最新"，其余提示二期） ---------- */
    document.getElementById("sortNew").onclick = () => {
      setActiveChip("sortNew");
      loadPosts();   // 默认就是按时间排序
    };
    ["sortHot", "sortLikes"].forEach((id) => {
      document.getElementById(id).onclick = () => {
        setActiveChip(id);
        App.showToast("该排序属于二期功能，先给你留好位置啦");
      };
    });
    function setActiveChip(id) {
      document.querySelectorAll(".filter-bar .chip").forEach((c) => c.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    setupNav();
    loadPosts();
  </script>
</body>
</html>
